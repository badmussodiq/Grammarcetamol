name: CI/CD

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  # ---------------------------------------------------------------------------
  # Test — always runs. Java services with a shared-java dependency need it
  # installed into the runner's local Maven repo first; there's no reactor pom
  # to sequence this automatically (see backend/README.md).
  # ---------------------------------------------------------------------------

  build-shared-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install shared-java into the local Maven repo
        working-directory: backend/shared-java
        run: mvn -B install -DskipTests
      - name: Cache the installed shared-java artifact for downstream jobs
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/grammarcetamol/shared-java
          key: shared-java-${{ github.sha }}

  test-java-standalone:
    # auth-service and gateway-service have no shared-java dependency.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate a throwaway RSA keypair (auth-service only)
        if: matrix.service == 'auth-service'
        working-directory: backend/auth-service
        run: |
          mkdir -p src/main/resources/keys
          openssl genrsa -out src/main/resources/keys/private.pem 2048
          openssl rsa -in src/main/resources/keys/private.pem -pubout -out src/main/resources/keys/public.pem
      - name: mvn test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B test

  test-java-shared-dependent:
    needs: build-shared-java
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [course-service, enrollment-service, review-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/grammarcetamol/shared-java
          key: shared-java-${{ github.sha }}
      - name: mvn test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B test

  test-node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment-service, notification-service, upload-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json
      - working-directory: backend/${{ matrix.service }}
        run: npm ci
      - working-directory: backend/${{ matrix.service }}
        run: npm run build
      - working-directory: backend/${{ matrix.service }}
        run: npm test

  test-frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      # apps/utilities is consumed as raw TS source via a tsconfig path alias, not an
      # npm dependency — actions/checkout already puts it on disk as a sibling, no
      # separate install step needed for it.
      - working-directory: apps/${{ matrix.app }}
        run: npm ci
      - working-directory: apps/${{ matrix.app }}
        run: npm run build
      - working-directory: apps/${{ matrix.app }}
        run: npm run test

  # ---------------------------------------------------------------------------
  # Build & push — only on a push to master, and only once every test job above
  # has passed. No deploy step: this repo has no deploy target configured yet,
  # so CI/CD stops at "images built and pushed to both registries."
  # ---------------------------------------------------------------------------

  build-and-push:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs:
      - test-java-standalone
      - test-java-shared-dependent
      - test-node-services
      - test-frontends
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: auth-service
            context: ./backend
            dockerfile: ./backend/auth-service/Dockerfile
          - name: course-service
            context: ./backend
            dockerfile: ./backend/course-service/Dockerfile
          - name: enrollment-service
            context: ./backend
            dockerfile: ./backend/enrollment-service/Dockerfile
          - name: review-service
            context: ./backend
            dockerfile: ./backend/review-service/Dockerfile
          - name: gateway-service
            context: ./backend
            dockerfile: ./backend/gateway-service/Dockerfile
          - name: payment-service
            context: ./backend/payment-service
            dockerfile: ./backend/payment-service/Dockerfile
          - name: notification-service
            context: ./backend/notification-service
            dockerfile: ./backend/notification-service/Dockerfile
          - name: upload-service
            context: ./backend/upload-service
            dockerfile: ./backend/upload-service/Dockerfile
          - name: student-frontend
            context: ./apps
            dockerfile: ./apps/student/Dockerfile
          - name: admin-frontend
            context: ./apps
            dockerfile: ./apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Docker Hub/GHCR require lowercase image names; github.repository_owner isn't
      # guaranteed to be lowercase (org/user names can be mixed-case).
      - name: Compute lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/grammarcetamol-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/grammarcetamol-${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/grammarcetamol-${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grammarcetamol-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy — SSH into the cloud server and pull+restart with this exact commit's
  # images. No git on the server: it only ever runs pre-built images, so each
  # deploy just refreshes docker-compose.yml + docker/ via scp, then runs the
  # server-side deploy.sh with the commit SHA as the image tag. Requires repo
  # secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY (not something this
  # workflow can create — add them once you have a real server) and a
  # pre-existing /opt/grammarcetamol/.env on that server (see README.md's
  # "Deploying to a cloud server" section for one-time setup).
  # ---------------------------------------------------------------------------

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker/"
          target: /opt/grammarcetamol

      - name: Pull + restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/grammarcetamol && bash docker/scripts/deploy.sh ${{ github.sha }}
