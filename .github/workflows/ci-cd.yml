name: CI/CD

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  # ---------------------------------------------------------------------------
  # Test — always runs. Java services with a shared-java dependency need it
  # installed into the runner's local Maven repo first; there's no reactor pom
  # to sequence this automatically (see backend/README.md).
  # ---------------------------------------------------------------------------

  build-shared-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install shared-java into the local Maven repo
        working-directory: backend/shared-java
        run: mvn -B install -DskipTests
      - name: Cache the installed shared-java artifact for downstream jobs
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/grammarcetamol/shared-java
          key: shared-java-${{ github.sha }}

  test-java-standalone:
    # auth-service and gateway-service have no shared-java dependency.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate a throwaway RSA keypair (auth-service only)
        if: matrix.service == 'auth-service'
        working-directory: backend/auth-service
        run: |
          mkdir -p src/main/resources/keys
          openssl genrsa -out src/main/resources/keys/private.pem 2048
          openssl rsa -in src/main/resources/keys/private.pem -pubout -out src/main/resources/keys/public.pem
      - name: mvn test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B test

  test-java-shared-dependent:
    needs: build-shared-java
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [course-service, enrollment-service, review-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/grammarcetamol/shared-java
          key: shared-java-${{ github.sha }}
      - name: mvn test
        working-directory: backend/${{ matrix.service }}
        run: mvn -B test

  test-node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment-service, notification-service, upload-service, live-class-service]
    steps:
      - uses: actions/checkout@v4
      # No cache: npm here — package-lock.json is intentionally not committed (see
      # .gitignore), so there's nothing for actions/setup-node's cache to hash against.
      # npm install (not npm ci) resolves fresh from package.json every run — slower, no
      # lock-file reproducibility across runs, but that's the accepted tradeoff.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm cache clean --force
      - working-directory: backend/${{ matrix.service }}
        run: npm install
      - working-directory: backend/${{ matrix.service }}
        run: npm run build
      - working-directory: backend/${{ matrix.service }}
        run: npm test

  test-frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [student, admin]
    steps:
      - uses: actions/checkout@v4
      # No cache: npm — same reasoning as test-node-services above.
      # Node 22, not 20 — jsdom 30.x (used by these apps' vitest suites) requires
      # Node ^22.22.2 || ^24.15.0 || >=26.0.0; on Node 20 its bundled undici throws
      # "webidl.util.markAsUncloneable is not a function" before any test can run.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # apps/utilities is consumed as raw TS source via a tsconfig path alias, not an npm
      # dependency, but it's a SIBLING PROJECT WITH ITS OWN node_modules (see its README) —
      # student/admin's TypeScript still needs utilities' own react/@types/react reachable
      # via Node's directory-walk resolution starting from utilities/src. Confirmed this is
      # required, not optional: the frontend Dockerfiles hit real "Cannot find module
      # 'react'" build failures without this exact step.
      - working-directory: apps/utilities
        run: npm install
      - working-directory: apps/${{ matrix.app }}
        run: npm install
      - working-directory: apps/${{ matrix.app }}
        run: npm run build
      - working-directory: apps/${{ matrix.app }}
        run: npm run test

  # ---------------------------------------------------------------------------
  # Build & push — on a push to master OR development, once every test job above
  # has passed. Pushes to Docker Hub only (sodmod1999). Every image also gets a
  # branch-specific floating tag (:latest for master, :dev for development) in
  # addition to the exact commit SHA — so a manual `docker pull ...:latest` never
  # accidentally picks up a development build, and vice versa. The `deploy` job
  # below never uses these floating tags itself (it always deploys the exact SHA
  # that was just built), they're purely for humans pulling by hand.
  # ---------------------------------------------------------------------------

  build-and-push:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && github.event_name == 'push'
    # Needed so `vars.NEXT_PUBLIC_API_URL` below resolves per-branch — a real, found-live gap:
    # without this, both frontend images were always built with the Dockerfile's own
    # ARG default (http://localhost:9000) baked in, regardless of which environment they'd
    # actually be deployed to. A visitor's browser resolves "localhost" to their OWN
    # machine, not the server, so every CI-built frontend image was silently broken for any
    # real deployment. Set NEXT_PUBLIC_API_URL as a VARIABLE (not secret — it's a public
    # URL) in both the production and development GitHub Environments: Settings ->
    # Environments -> <name> -> Environment variables -> Add variable.
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    needs:
      - test-java-standalone
      - test-java-shared-dependent
      - test-node-services
      - test-frontends
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: auth-service
            context: ./backend
            dockerfile: ./backend/auth-service/Dockerfile
          - name: course-service
            context: ./backend
            dockerfile: ./backend/course-service/Dockerfile
          - name: enrollment-service
            context: ./backend
            dockerfile: ./backend/enrollment-service/Dockerfile
          - name: review-service
            context: ./backend
            dockerfile: ./backend/review-service/Dockerfile
          - name: gateway-service
            context: ./backend
            dockerfile: ./backend/gateway-service/Dockerfile
          - name: payment-service
            context: ./backend/payment-service
            dockerfile: ./backend/payment-service/Dockerfile
          - name: notification-service
            context: ./backend/notification-service
            dockerfile: ./backend/notification-service/Dockerfile
          - name: upload-service
            context: ./backend/upload-service
            dockerfile: ./backend/upload-service/Dockerfile
          - name: live-class-service
            context: ./backend/live-class-service
            dockerfile: ./backend/live-class-service/Dockerfile
          - name: student-frontend
            context: ./apps
            dockerfile: ./apps/student/Dockerfile
          - name: admin-frontend
            context: ./apps
            dockerfile: ./apps/admin/Dockerfile
    env:
      FLOATING_TAG: ${{ github.ref == 'refs/heads/master' && 'latest' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Only student-frontend/admin-frontend declare this ARG — harmless no-op for
          # every other Dockerfile in this matrix (Docker doesn't error on an unused
          # --build-arg, it just ignores it).
          # Falls back to the Dockerfile's own default if the variable isn't set yet in
          # this environment — an unset vars.X resolves to an empty string, and an empty
          # NEXT_PUBLIC_API_URL would be strictly worse (baking in nothing) than the
          # Dockerfile's working-for-local-testing default, so this fallback keeps
          # behavior unchanged until the variable is actually configured, rather than
          # silently degrading further.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:9000' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grammarcetamol-${{ matrix.name }}:${{ env.FLOATING_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/grammarcetamol-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy — SSH into the cloud server and pull+restart with this exact commit's
  # images. No git on the server: it only ever runs pre-built images, so each
  # deploy refreshes docker-compose.yml + docker/ + .env via scp, then runs the
  # server-side deploy.sh with the commit SHA as the image tag.
  #
  # Two GitHub Environments, "production" (master) and "development" (development
  # branch) — see README.md's "Deploying a second environment to the same
  # server" section for how to create them and what secrets each one needs.
  # `environment:` below resolves every `secrets.X` in this job from whichever
  # environment matches the branch that triggered it, so both branches can point
  # at completely different secret VALUES (different DEPLOY_HOST if you ever
  # split to a second server, different ENV_FILE contents — different DB names,
  # ports, COMPOSE_PROJECT_NAME, etc. — see .env.example's "running a second
  # environment on the same server" section) while this workflow's own logic
  # stays identical for both. Each environment needs its own DEPLOY_HOST /
  # DEPLOY_USER / DEPLOY_SSH_KEY / ENV_FILE secret (Settings -> Environments ->
  # <name> -> Add secret; not something this workflow can create for you).
  #
  # .env is generated from the ENV_FILE secret on EVERY deploy, not created by
  # hand on the server — paste the full contents of what .env should contain
  # (see .env.example) into each environment's ENV_FILE secret.
  # ---------------------------------------------------------------------------

  deploy:
    needs: build-and-push
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    env:
      # Separate directories on the same host so both environments can run
      # simultaneously — see docker-compose.yml's CONTAINER_PREFIX/*_HOST_PORT
      # overrides, which is what actually keeps their containers/ports/volumes
      # from colliding once both are deployed here.
      DEPLOY_DIR: ${{ github.ref == 'refs/heads/master' && '/opt/grammarcetamol' || '/opt/grammarcetamol-dev' }}
    steps:
      - uses: actions/checkout@v4

      # Written to a local file first (not interpolated straight into a shell
      # command) so a secret value containing shell metacharacters can't be
      # mis-parsed — printf %s + an env var, not string interpolation.
      - name: Write .env for this deploy
        env:
          ENV_CONTENTS: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_CONTENTS" > server.env

      # Idempotent (mkdir -p) — first deploy to a fresh server creates it, every deploy
      # after that is a no-op. Needed before the scp step below: it doesn't create nested
      # target directories on its own.
      - name: Ensure the deploy directory exists on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy compose files + env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker/,server.env"
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull + restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ${{ env.DEPLOY_DIR }} && mv server.env .env && bash docker/scripts/deploy.sh ${{ github.sha }}
