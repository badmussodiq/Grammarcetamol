# Centralized full-stack compose file — the SAME file for local dev and a cloud server,
# no edits needed between them. Pulls in the existing infra-only compose
# (Postgres/Redis/RabbitMQ/MinIO/Mongo, with their own healthchecks and idempotent
# per-DB provisioning entrypoints) via `include:`, then layers every app service on top.
#
# Startup order is enforced via `depends_on: ... condition: service_healthy` chains:
#   infra (healthy) -> backend services (healthy) -> gateway (healthy) -> both frontends
#
# Image source is env-var-driven (see .env.example: IMAGE_PREFIX / IMAGE_TAG /
# IMAGE_PULL_POLICY) so the exact same `image:`+`build:` pair either builds locally
# (the default — IMAGE_PULL_POLICY=build never attempts a pull) or pulls a pre-built
# image a CI pipeline already pushed to GHCR/Docker Hub (set IMAGE_PREFIX to that
# registry's prefix and IMAGE_PULL_POLICY=missing on a cloud server) — same file, only
# .env differs.
#
# Usage (local):
#   cp .env.example .env   # fill in PAYSTACK_SECRET_KEY etc.
#   docker compose up -d --build
#   docker compose ps      # watch services flip to "healthy"
#
# Usage (cloud server, pulling images CI already built):
#   cp .env.example .env
#   # then in .env: IMAGE_PREFIX=ghcr.io/<owner>/grammarcetamol-  (or <dockerhub-user>/grammarcetamol-)
#   #               IMAGE_TAG=latest
#   #               IMAGE_PULL_POLICY=missing
#   docker compose up -d

include:
  - docker/docker-compose.dev.yml

services:
  # ---------------------------------------------------------------------------
  # Backend — Java / Spring Boot
  # ---------------------------------------------------------------------------

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}auth-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-auth-service
    restart: always
    ports:
      - "9001:9001"
      - "9091:9091"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      FRONTEND_URL: ${STUDENT_FRONTEND_URL:-http://localhost:3000}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@grammarcetamol.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  course-service:
    build:
      context: ./backend
      dockerfile: course-service/Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}course-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-course-service
    restart: always
    ports:
      - "9002:9002"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  enrollment-service:
    build:
      context: ./backend
      dockerfile: enrollment-service/Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}enrollment-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-enrollment-service
    restart: always
    ports:
      - "9003:9003"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      COURSE_SERVICE_URL: http://course-service:9002
      UPLOAD_SERVICE_URL: http://upload-service:9006
      AUTH_SERVICE_URL: http://auth-service:9001
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  review-service:
    build:
      context: ./backend
      dockerfile: review-service/Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}review-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-review-service
    restart: always
    ports:
      - "9004:9004"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ENROLLMENT_SERVICE_URL: http://enrollment-service:9003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend — Node / NestJS
  # ---------------------------------------------------------------------------

  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}payment-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-payment-service
    restart: always
    ports:
      - "9005:9005"
    environment:
      PORT: 9005
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYMENT_GATEWAY: paystack
      AUTH_SERVICE_URL: http://auth-service:9001
      COURSE_SERVICE_URL: http://course-service:9002
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:9005/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}notification-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-notification-service
    restart: always
    ports:
      - "9008:9008"
    environment:
      PORT: 9008
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Grammarcetamol}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USERNAME: platform
      MONGO_PASSWORD: platform12345
      MONGO_DB_NAME: notification_db
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:9008/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  upload-service:
    build:
      context: ./backend/upload-service
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}upload-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-upload-service
    restart: always
    ports:
      - "9006:9006"
    environment:
      PORT: 9006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: platform
      DB_PASSWORD: platform
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      COURSE_SERVICE_URL: http://course-service:9002
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: course-content
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: platform
      MINIO_SECRET_KEY: platform12345
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:9006/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Backend — Gateway (the stack's front door; depends on every other backend
  # service being healthy, not just infra)
  # ---------------------------------------------------------------------------

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    image: ${IMAGE_PREFIX:-grammarcetamol/}gateway-service:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-gateway-service
    restart: always
    ports:
      - "9000:9000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:9001
      COURSE_SERVICE_URL: http://course-service:9002
      ENROLLMENT_SERVICE_URL: http://enrollment-service:9003
      PAYMENT_SERVICE_URL: http://payment-service:9005
      REVIEW_SERVICE_URL: http://review-service:9004
      UPLOAD_SERVICE_URL: http://upload-service:9006
      NOTIFICATION_SERVICE_URL: http://notification-service:9008
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-secret-change-in-prod}
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Frontends — only start once every backend service (gateway included) is
  # actually healthy, per the "all backend services up before frontend" requirement.
  # ---------------------------------------------------------------------------

  student-frontend:
    build:
      context: ./apps
      dockerfile: student/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9000}
    image: ${IMAGE_PREFIX:-grammarcetamol/}student-frontend:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-student-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — Next's standalone server binds IPv4-only
      # (HOSTNAME=0.0.0.0), and busybox wget resolves "localhost" to ::1 first.
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  admin-frontend:
    build:
      context: ./apps
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9000}
    image: ${IMAGE_PREFIX:-grammarcetamol/}admin-frontend:${IMAGE_TAG:-local}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    container_name: grammarcetamol-admin-frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — Next's standalone server binds IPv4-only
      # (HOSTNAME=0.0.0.0), and busybox wget resolves "localhost" to ::1 first.
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
