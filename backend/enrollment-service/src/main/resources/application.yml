server:
  port: 9003

spring:
  application:
    name: enrollment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:9009}/enrollment_db
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:9011}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  course-service-url: ${COURSE_SERVICE_URL:http://localhost:9002}
  upload-service-url: ${UPLOAD_SERVICE_URL:http://localhost:9006}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:9001}
  # 20%/14-day at-risk thresholds match implementation-phases.md's Phase 3 note — the only place
  # in the repo's specs a concrete number is given.
  at-risk-completion-threshold-pct: ${AT_RISK_COMPLETION_THRESHOLD_PCT:20}
  at-risk-min-days-since-enrollment: ${AT_RISK_MIN_DAYS_SINCE_ENROLLMENT:14}

management:
  endpoints:
    web:
      exposure:
        include: health,info
