server:
  port: 9004

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:9009}/review_db
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:9011}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  enrollment-service-url: ${ENROLLMENT_SERVICE_URL:http://localhost:9003}
  # US-STU-012's stated threshold — a student must have completed at least this much of a course
  # before they can leave a review.
  review-completion-threshold-pct: ${REVIEW_COMPLETION_THRESHOLD_PCT:50}
  review-edit-window-days: ${REVIEW_EDIT_WINDOW_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
