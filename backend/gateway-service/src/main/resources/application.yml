server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  course-service-url: ${COURSE_SERVICE_URL:http://localhost:8083}
  internal-token: ${INTERNAL_TOKEN:dev-internal-secret-change-in-prod}

grpc:
  client:
    auth-service:
      address: static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9091}
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,routes,info
  endpoint:
    health:
      show-details: always
