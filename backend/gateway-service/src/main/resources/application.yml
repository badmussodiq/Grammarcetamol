server:
  port: 9000

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:9010}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

gateway:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:9001}
  course-service-url: ${COURSE_SERVICE_URL:http://localhost:9002}
  enrollment-service-url: ${ENROLLMENT_SERVICE_URL:http://localhost:9003}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:9005}
  review-service-url: ${REVIEW_SERVICE_URL:http://localhost:9004}
  upload-service-url: ${UPLOAD_SERVICE_URL:http://localhost:9006}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:9008}
  live-class-service-url: ${LIVE_CLASS_SERVICE_URL:http://localhost:9007}
  internal-token: ${INTERNAL_TOKEN:dev-internal-secret-change-in-prod}

grpc:
  client:
    auth-service:
      address: static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9091}
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,routes,info
  endpoint:
    health:
      show-details: always
