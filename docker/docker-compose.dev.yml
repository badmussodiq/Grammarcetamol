services:
  postgres:
    image: postgres:16
    container_name: grammarcetamol-postgres
    restart: always
    ports:
      - "9009:5432"
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: auth_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: grammarcetamol-redis
    restart: always
    ports:
      - "9010:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: grammarcetamol-rabbitmq
    restart: always
    ports:
      - "9011:5672"
      - "9012:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only object storage for Upload/Media Service (S3-compatible). Console at :9014,
  # S3 API at :9013 — part of the same 9000-series block as every other Grammarcetamol
  # container (app services 9000-9008, infra 9009+) so nothing here can collide with some
  # other project's own Postgres/Redis/RabbitMQ/MinIO running on the same machine.
  minio:
    image: minio/minio:latest
    container_name: grammarcetamol-minio
    restart: always
    ports:
      - "9013:9000"
      - "9014:9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform12345
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated MongoDB instance for Live Class Service (backend/live-class-service, PLAN.md
  # Task 31) — deliberately its OWN container, not the pre-existing standalone `platform-mongo`
  # container that already runs outside this compose file on the default 27017 with an
  # unrelated `notifications` database. Same 9000-series block as everything else here.
  mongo:
    image: mongo:7
    container_name: grammarcetamol-mongo
    restart: always
    ports:
      - "9015:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: platform
      MONGO_INITDB_ROOT_PASSWORD: platform12345
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  mongo-data:
