# DATA_DIR — every database's data directory is a BIND MOUNT under this one path, not a
# Docker named volume, specifically so the data is plain files at a known location on the
# host: trivially rsync-able/tar-able to migrate to a different server, visible with `ls`,
# backed up with any ordinary file-based tool — no `docker volume export`/`docker cp`
# dance required. Defaults to ../data (relative to THIS file's own directory, docker/ —
# resolves to <repo-root>/data locally, e.g. ../data/postgres). Set to an ABSOLUTE path in
# any real deployment's .env (e.g. DATA_DIR=/opt/grammarcetamol/data for production,
# /opt/grammarcetamol-dev/data for development — see .env.example) so it's unambiguous
# regardless of what directory compose is invoked from.
services:
  postgres:
    image: postgres:18.0-alpine
    container_name: ${CONTAINER_PREFIX:-grammarcetamol}-postgres
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT:-9009}:5432"
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: auth_db
    volumes:
      - ${DATA_DIR:-../data}/postgres:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
      - ./scripts/ensure-postgres-databases.sh:/ensure-postgres-databases.sh:ro
    entrypoint: [ "bash", "/postgres-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U platform -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: ${CONTAINER_PREFIX:-grammarcetamol}-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-9010}:6379"
    volumes:
      - ${DATA_DIR:-../data}/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: ${CONTAINER_PREFIX:-grammarcetamol}-rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_HOST_PORT:-9011}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-9012}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${DATA_DIR:-../data}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only object storage for Upload/Media Service (S3-compatible). Console at :9014,
  # S3 API at :9013 — part of the same 9000-series block as every other Grammarcetamol
  # container (app services 9000-9008, infra 9009+) so nothing here can collide with some
  # other project's own Postgres/Redis/RabbitMQ/MinIO running on the same machine.
  minio:
    image: minio/minio:latest
    container_name: ${CONTAINER_PREFIX:-grammarcetamol}-minio
    restart: always
    ports:
      - "${MINIO_API_HOST_PORT:-9013}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9014}:9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform12345
    command: server /data --console-address ":9001"
    volumes:
      - ${DATA_DIR:-../data}/minio:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated MongoDB instance for Live Class Service (backend/live-class-service, PLAN.md
  # Task 31) — deliberately its OWN container, not the pre-existing standalone `platform-mongo`
  # container that already runs outside this compose file on the default 27017 with an
  # unrelated `notifications` database. Same 9000-series block as everything else here.
  mongo:
    image: mongo:latest
    container_name: ${CONTAINER_PREFIX:-grammarcetamol}-mongo
    restart: always
    ports:
      - "${MONGO_HOST_PORT:-9015}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: platform
      MONGO_INITDB_ROOT_PASSWORD: platform12345
    volumes:
      - ${DATA_DIR:-../data}/mongo:/data/db
      - ./scripts/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./scripts/ensure-mongo-databases.sh:/ensure-mongo-databases.sh:ro
    entrypoint: [ "bash", "/mongo-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: ${CONTAINER_PREFIX:-grammarcetamol}-network
